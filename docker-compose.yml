services:
  postgres:
    image: postgres:16
    container_name: sistema-votacao-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sistema_votacao}
    ports:
      # Publicado apenas no loopback: serve para administração e para o dev local
      # (`next dev` no host conecta em 127.0.0.1:5432). Nunca exposto à internet.
      # O app e o backup acessam o banco pela rede interna do Docker pelo hostname
      # "postgres", sem depender desta porta.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis: backend do rate limit de login (janela fixa). Acesso apenas pela rede
  # interna do Docker; sem porta publicada e sem persistência (os contadores são
  # efêmeros por natureza — perder a janela em um restart é aceitável).
  redis:
    image: redis:7-alpine
    container_name: sistema-votacao-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Identidade institucional injetada em tempo de build (variáveis NEXT_PUBLIC_*).
      # Defina NEXT_PUBLIC_APP_NAME/NEXT_PUBLIC_ORG_NAME no .env antes de subir.
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-}
        NEXT_PUBLIC_ORG_NAME: ${NEXT_PUBLIC_ORG_NAME:-}
    container_name: sistema-votacao-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sistema_votacao}?schema=public"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # Token de onboarding: libera a criação do PRIMEIRO administrador em /setup.
      # Necessário apenas até o admin existir; depois pode ser removido do .env.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-}
      AWS_FOLDER_PREFIX: ${AWS_FOLDER_PREFIX:-}
    ports:
      # Apenas no loopback. O TLS é terminado pelo Nginx do host, que faz proxy
      # para 127.0.0.1:3000 (ver deploy/nginx/sistema-votacao.conf). Assim o app
      # não fica exposto diretamente à internet.
      - "127.0.0.1:3000:3000"
    volumes:
      # Anexos enviados pela aplicação (fotos, PDFs). Persiste entre reinícios e
      # recriações do container; sem isso o filesystem do container é efêmero.
      - uploads:/app/public/uploads
    healthcheck:
      # readiness: valida o processo e a conexão com o Postgres via /api/health.
      # start_period cobre o tempo de `prisma migrate deploy` + boot do servidor.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Serviço de backup criptografado do banco e dos anexos (AES-256-GCM).
  # Sobe junto com o stack, faz um backup no start e depois a cada
  # BACKUP_INTERVAL_HOURS. Os arquivos ficam no volume nomeado "pgbackups".
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: sistema-votacao-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sistema_votacao}?schema=public"
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      # Anexos: o mesmo volume montado no app é arquivado (tar+gzip) e cifrado
      # junto com o dump, garantindo que fotos/PDFs sejam recuperáveis.
      # Restauração: docker compose run --rm backup node uploads-restore.mjs <arquivo.uploads.tar.gz.enc>
      UPLOADS_DIR: /uploads
      # Cópia offsite (opcional): defina BACKUP_S3_BUCKET para enviar cada backup
      # (criptografado) ao S3, protegendo contra a perda do host inteiro.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - pgbackups:/backups
      # Acesso de escrita (não :ro) para permitir a restauração dos anexos via
      # `docker compose run --rm backup node uploads-restore.mjs ...`.
      - uploads:/uploads

volumes:
  pgdata:
  uploads:
  pgbackups:
