# Vhost do Sistema de Votacao Eletronica (Camara de Vereadores).
#
# O TLS e terminado pelo Nginx do HOST; a aplicacao roda em container exposta
# apenas em 127.0.0.1:3000 (ver docker-compose.yml). O dominio publico nunca
# chega direto ao container.
#
# Instalacao (Ubuntu/Debian):
#   1. Ajuste "server_name" e, se necessario, os caminhos dos certificados.
#   2. Copie para o Nginx:
#        sudo cp deploy/nginx/sistema-votacao.conf /etc/nginx/sites-available/sistema-votacao
#        sudo ln -s /etc/nginx/sites-available/sistema-votacao /etc/nginx/sites-enabled/
#   3. Valide e recarregue:
#        sudo nginx -t && sudo systemctl reload nginx
#
# Certificado Let's Encrypt (com o DNS do dominio ja apontando para o servidor):
#   sudo certbot --nginx -d votacao.suacidade.gov.br
#   O certbot obtem o certificado e ajusta automaticamente os caminhos
#   ssl_certificate/ssl_certificate_key abaixo (e cria a renovacao automatica).
#
# Lembre-se de definir NEXTAUTH_URL no .env com o MESMO dominio https
# (ex.: https://votacao.suacidade.gov.br), pois os cookies de sessao dependem dele.

# Preserva WebSocket (upgrade) quando presente e faz keep-alive quando nao.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS (deixa passar o desafio do certbot em /.well-known/).
server {
    listen      80;
    listen      [::]:80;
    server_name votacao.suacidade.gov.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Em Nginx >= 1.25.1 prefira "listen 443 ssl;" + "http2 on;".
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name votacao.suacidade.gov.br;

    ssl_certificate     /etc/letsencrypt/live/votacao.suacidade.gov.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votacao.suacidade.gov.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Anexos enviados pelos vereadores (fotos e PDFs) podem ser grandes.
    client_max_body_size 25m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
    }
}
